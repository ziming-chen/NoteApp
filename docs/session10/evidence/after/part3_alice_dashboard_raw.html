<div class="card">
  <h2>Grade detail (API)</h2>
  <p>Look up a single grade by its id.</p>
  <input type="number" id="noteId" placeholder="note id" value="2">
  <button onclick="loadNote()">Load</button>
  <pre id="apiOut"></pre>
</div>

<script>
  const TOKEN = "eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJ1c2VyX2lkIjogNiwgInVzZXJuYW1lIjogImFsaWNlIiwgInJvbGUiOiAic3R1ZGVudCJ9.Ie7A_WTgxtQlV44M4E--MyqZCB8dbYe3aT3PYBmEDuo";
  async function loadNote() {
    const id = document.getElementById('noteId').value;
    const res = await fetch('/api/notes/' + id, {
      headers: { 'Authorization': 'Bearer ' + TOKEN }
    });
    const data = await res.json();
    document.getElementById('apiOut').textContent = JSON.stringify(data, null, 2);
  }
</script>
